name: Deploy SSR

on:
  push:
    branches:
      - main
      - ssr
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend SSR
        working-directory: client
        env:
          NUXT_PUBLIC_API_URL: ${{ vars.NUXT_PUBLIC_API_URL }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare frontend directory
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /var/www/html/client/.output"

      - name: Deploy frontend SSR
        run: |
          rsync -r --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }}" \
            ./client/.output/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/client/.output/"

      - name: Deploy API source
        run: |
          rsync -r \
            --exclude .env \
            --exclude .env.local \
            --exclude vendor \
            --exclude var/cache \
            --exclude var/log \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }}" \
            ./api/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/api/"

      - name: Deploy docker-compose
        run: |
          rsync -r \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }}" \
            api/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/api/docker-compose.yml"

      - name: Restart Nginx
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo nginx -t && sudo systemctl reload nginx"

      - name: Build and restart containers
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "
              set -e

              cd /var/www/html/api

              test -s .env || (
                echo 'Missing /var/www/html/api/.env on the VPS.'
                exit 1
              )

              grep -q '^DATABASE_URL=.*@db:' .env || (
                echo 'DATABASE_URL must point to the Docker service db.'
                exit 1
              )

              echo 'Starting Docker containers...'
              docker-compose up -d --build --force-recreate

              echo 'Waiting for MySQL...'
              until docker-compose exec -T db mysqladmin ping -h localhost -uroot -proot --silent; do
                sleep 2
              done

              echo 'Waiting for Symfony...'
              until curl -sf http://127.0.0.1:8000/api/me > /dev/null; do
                sleep 2
              done

              echo 'Waiting for Nuxt...'
              until curl -sf http://127.0.0.1:3000/ > /dev/null; do
                sleep 2
              done

              echo 'Clearing Symfony production cache...'
              docker-compose exec -T api php bin/console cache:clear --env=prod --no-warmup

              echo 'Running Doctrine migrations...'
              docker-compose exec -T api php bin/console doctrine:migrations:migrate \
                --no-interaction \
                --allow-no-migration

              echo 'Checking containers...'
              docker-compose ps

              echo 'Deployment completed successfully.'
            "