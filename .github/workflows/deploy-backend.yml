name: Deploy Backend

on:
  push:
    branches:
      - main
      - ssr
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy API source
        run: |
          rsync -r \
            --exclude .env \
            --exclude .env.local \
            --exclude vendor \
            --exclude var/cache \
            --exclude var/log \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }}" \
            ./api/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/api/"

      - name: Deploy docker-compose
        run: |
          rsync -r \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }}" \
            api/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/api/docker-compose.yml"

      - name: Build and restart API
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "
              set -e

              cd /var/www/html/api

              test -s .env || (
                echo 'Missing /var/www/html/api/.env on the VPS.'
                exit 1
              )

              grep -q '^DATABASE_URL=.*@db:' .env || (
                echo 'DATABASE_URL must point to the Docker service db.'
                exit 1
              )

              echo 'Checking Docker Compose configuration...'
              docker-compose config

              echo 'Building and restarting Symfony API...'
              docker-compose up -d --build --force-recreate api

              echo 'Waiting for MySQL...'
              until docker-compose exec -T db mysqladmin ping -h localhost -uroot -proot --silent; do
                sleep 2
              done

              echo 'Waiting for Symfony...'
              until curl -sf http://127.0.0.1:8000/api/me > /dev/null; do
                sleep 2
              done

              echo 'Clearing Symfony production cache...'
              docker-compose exec -T api php bin/console cache:clear --env=prod --no-warmup

              echo 'Running Doctrine migrations...'
              docker-compose exec -T api php bin/console doctrine:migrations:migrate \
                --no-interaction \
                --allow-no-migration

              echo 'Checking containers...'
              docker-compose ps

              echo 'Backend deployment completed successfully.'
            "

      - name: Restart Nginx
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo nginx -t && sudo systemctl reload nginx"

      - name: Deployment completed
        run: echo "Backend deployment completed successfully."